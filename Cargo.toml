[package]
name = "rust_crud_api"
version = "0.1.0"
edition = "2024"

[dependencies]
arc = "0.0.1"
bcrypt = "0.17.0"
mutex = "1.0.0"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
tokio = { version = "1.45.1", features = ["full"] }
uuid = { version = "1.17.0", features = ["v4", "serde"] }
warp = "0.3.7"
